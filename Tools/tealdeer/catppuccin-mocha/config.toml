# tealdeer config, seeded by DotForge (Catppuccin Mocha).
# DotForge never overwrites this file: edit it freely, or delete it to get the
# seed back on a fresh setup. Every key: https://docs.tealdeer.org (Configuration).
# Run `tldr --show-paths` to see which files tealdeer reads.

[display]
# The page name above the description.
show_title = true
# Keep the blank lines between examples.
compact = false

[updates]
# Download the pages on first use and refresh them weekly, so `tldr` works
# right after install without a manual `tldr --update`.
auto_update = true
auto_update_interval_hours = 168

[search]
# Windows pages first, then cross-platform ones, then every other platform.
platforms = ["current", "common", "all"]

[style.command_name]
foreground = { rgb = { r = 203, g = 166, b = 247 } }
bold = true

[style.description]
foreground = { rgb = { r = 166, g = 173, b = 200 } }

[style.example_text]
foreground = { rgb = { r = 166, g = 227, b = 161 } }

[style.example_code]
foreground = { rgb = { r = 137, g = 180, b = 250 } }

[style.example_variable]
foreground = { rgb = { r = 250, g = 179, b = 135 } }
italic = true
