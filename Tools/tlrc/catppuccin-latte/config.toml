# tlrc config, seeded by DotForge (Catppuccin Latte).
# DotForge never overwrites this file: edit it freely, or delete it to get the
# seed back on a fresh setup. Every key: `tldr --gen-config`, or
# https://github.com/tldr-pages/tlrc#configuration.

[cache]
# Download the pages on first use and refresh them weekly.
auto_update = true
max_age = 168

[output]
show_title = true
platform_title = false
# Placeholders in their long form (--recursive rather than -r).
option_style = "long"
# Wrap at the terminal width.
line_length = 0

[style.title]
color = { hex = "#8839ef" }
bold = true

[style.description]
color = { hex = "#6c6f85" }

[style.bullet]
color = { hex = "#40a02b" }

[style.example]
color = { hex = "#1e66f5" }

[style.url]
color = { hex = "#209fb5" }
italic = true

[style.inline_code]
color = { hex = "#179299" }
italic = true

[style.placeholder]
color = { hex = "#fe640b" }
italic = true
