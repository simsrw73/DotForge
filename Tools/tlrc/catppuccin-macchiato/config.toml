# tlrc config, seeded by DotForge (Catppuccin Macchiato).
# DotForge never overwrites this file: edit it freely, or delete it to get the
# seed back on a fresh setup. Every key: `tldr --gen-config`, or
# https://github.com/tldr-pages/tlrc#configuration.

[cache]
# Download the pages on first use and refresh them weekly.
auto_update = true
max_age = 168

[output]
show_title = true
platform_title = false
# Placeholders in their long form (--recursive rather than -r).
option_style = "long"
# Wrap at the terminal width.
line_length = 0

[style.title]
color = { hex = "#c6a0f6" }
bold = true

[style.description]
color = { hex = "#a5adcb" }

[style.bullet]
color = { hex = "#a6da95" }

[style.example]
color = { hex = "#8aadf4" }

[style.url]
color = { hex = "#7dc4e4" }
italic = true

[style.inline_code]
color = { hex = "#8bd5ca" }
italic = true

[style.placeholder]
color = { hex = "#f5a97f" }
italic = true
