# tlrc config, seeded by DotForge (Catppuccin Mocha).
# DotForge never overwrites this file: edit it freely, or delete it to get the
# seed back on a fresh setup. Every key: `tldr --gen-config`, or
# https://github.com/tldr-pages/tlrc#configuration.

[cache]
# Download the pages on first use and refresh them weekly.
auto_update = true
max_age = 168

[output]
show_title = true
platform_title = false
# Placeholders in their long form (--recursive rather than -r).
option_style = "long"
# Wrap at the terminal width.
line_length = 0

[style.title]
color = { hex = "#cba6f7" }
bold = true

[style.description]
color = { hex = "#a6adc8" }

[style.bullet]
color = { hex = "#a6e3a1" }

[style.example]
color = { hex = "#89b4fa" }

[style.url]
color = { hex = "#74c7ec" }
italic = true

[style.inline_code]
color = { hex = "#94e2d5" }
italic = true

[style.placeholder]
color = { hex = "#fab387" }
italic = true
