name: test

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pester:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install the development modules (build/requirements.psd1)
        shell: pwsh
        run: |
          ./build/Install-DFDevDependencies.ps1
          Import-Module Pester -RequiredVersion (Import-PowerShellDataFile build/requirements.psd1).Pester
          "PowerShell $($PSVersionTable.PSVersion); Pester $((Get-Module Pester).Version)"

      - name: Run the suite (sentinel XDG folders)
        shell: pwsh
        run: ./build/Test-DFFull.ps1
