name: test

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pester:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Pester 6 and the build pipeline's modules
        shell: pwsh
        run: |
          # Exact versions, so a new release can't change what CI runs.
          Install-PSResource -Name Pester -Version '6.2.0' -Repository PSGallery -TrustRepository -Scope CurrentUser
          # The package-universe build pipeline (build/Private/DFPackageUniverse.*) and its tests use PSSQLite and powershell-yaml.
          Install-PSResource -Name PSSQLite -Version '1.1.0' -Repository PSGallery -TrustRepository -Scope CurrentUser
          Install-PSResource -Name powershell-yaml -Version '0.4.12' -Repository PSGallery -TrustRepository -Scope CurrentUser
          Import-Module Pester -RequiredVersion 6.2.0
          "PowerShell $($PSVersionTable.PSVersion); Pester $((Get-Module Pester).Version)"

      - name: Run the suite (sentinel XDG folders)
        shell: pwsh
        run: ./build/Test-DFFull.ps1
